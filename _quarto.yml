project:
  type: manuscript

manuscript:
  article: index.qmd
  

format:
   
  html:
    toc: true
    number-sections: true    
    code-fold: false
    code-overflow: wrap
    code-tools: true
  pdf:
    toc: true
    code-overflow: wrap
    header-includes:
      - \usepackage{multirow}
    include-in-header: 
      text: |
        \usepackage{fvextra}
        \DefineVerbatimEnvironment{Highlighting}{Verbatim}{breaklines,commandchars=\\\{\}}

  docx:
    toc: true


metadata:
  author: "Rachel Rapier"
  date: "August 27, 2026"
  title: "Psych 755 Project"
  
bibliography: references.bib

execute:
  echo: true
  warning: false
  message: false
